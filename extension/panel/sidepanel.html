<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AgentBrowser</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="header">
    <img id="logo" src="../icons/logo.png" alt="" width="22" height="22">
    <span id="status-dot" class="dot down" title="hub status"></span>
    <span class="grow"></span>
    <select id="chat-switcher" title="Chats" aria-label="Chats"></select>
    <span class="grow"></span>
    <button id="settings-btn" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </header>

  <div id="banner" hidden>Hub disconnected. Start the hub server, messages are disabled.</div>

  <main id="messages"></main>

  <section id="settings-view" aria-label="Settings" hidden>
    <h2 class="set-title">Settings</h2>

    <div class="set-group">
      <div class="set-head">
        <label class="set-label" for="key-anthropic">Anthropic API key</label>
        <span id="key-anthropic-state" class="set-state">not set</span>
      </div>
      <input id="key-anthropic" class="set-input" type="password" autocomplete="off" spellcheck="false"
             placeholder="sk-ant-…" aria-label="Anthropic API key">
      <div class="set-row">
        <button id="key-anthropic-save" type="button" aria-label="Save the Anthropic API key">Save</button>
        <button id="key-anthropic-clear" type="button" aria-label="Clear the stored Anthropic API key">Clear</button>
      </div>
    </div>

    <div class="set-group">
      <div class="set-head">
        <label class="set-label" for="key-openai">OpenAI API key</label>
        <span id="key-openai-state" class="set-state">not set</span>
      </div>
      <input id="key-openai" class="set-input" type="password" autocomplete="off" spellcheck="false"
             placeholder="sk-…" aria-label="OpenAI API key">
      <div class="set-row">
        <button id="key-openai-save" type="button" aria-label="Save the OpenAI API key">Save</button>
        <button id="key-openai-clear" type="button" aria-label="Clear the stored OpenAI API key">Clear</button>
      </div>
    </div>

    <p class="set-note">Keys are stored locally on this machine only, by the hub, in a file only your
      user account can read. The panel never receives a saved key back; it is only told whether one is
      configured.</p>

    <div class="set-row">
      <button id="settings-close" type="button" aria-label="Close settings">Done</button>
    </div>
  </section>

  <footer id="composer">
    <div id="mention-pop" class="mention-pop" role="listbox" aria-label="open tabs" hidden></div>
    <div id="command-pop" class="mention-pop cmd-pop" role="listbox" aria-label="slash commands" hidden></div>

    <div id="chips" class="chip-row" hidden></div>
    <div id="attachments" class="chip-row" hidden></div>
    <div id="composer-error" class="composer-error" hidden></div>
    <div id="interim" class="interim" hidden></div>

    <textarea id="input" rows="1" placeholder="Message the agent — @ tags tabs, / commands"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="command-pop"></textarea>

    <div id="composer-buttons">
      <button id="attach" class="icon-btn" type="button" title="Attach files" aria-label="Attach files">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 11.5 12 19.9a5.2 5.2 0 0 1-7.4-7.4l8.5-8.5a3.5 3.5 0 0 1 4.9 4.9l-8.4 8.5a1.7 1.7 0 0 1-2.5-2.5l7.8-7.8"/>
        </svg>
      </button>
      <select id="backend" title="Adapter and model" aria-label="Adapter and model"></select>
      <span class="grow"></span>
      <button id="abort" type="button" hidden>Stop</button>
      <button id="mic" class="icon-btn" type="button" title="Dictate" aria-label="Dictate" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="11" rx="3"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
        </svg>
      </button>
      <button id="send" class="send-btn" type="button" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19.5V5M5.5 11.5 12 5l6.5 6.5"/>
        </svg>
      </button>
    </div>

    <div id="session-usage" class="session-usage"
         title="Tokens and cost for this conversation only. Cleared by New chat." hidden></div>

    <input id="file-input" type="file" multiple hidden>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
