<!doctype html>
<meta charset="utf-8">
<title>ab zoom render</title>
<body style="margin:0;background:#111;color:#eee;font:13px monospace">
<div id="hud" style="position:fixed;top:8px;left:8px;z-index:9;background:#000a;padding:6px 10px;border-radius:6px">loading…</div>
<canvas id="cv" style="display:block"></canvas>
<video id="v" muted playsinline style="display:none"></video>
<script>
// Zoom-pan render of an agentbrowser recording (openScreen-style frame:
// blurred source backdrop + rounded inset video + virtual cursor).
//   ?src=<webm>  ?track=<track.json>  ?w=<output width px, default 1920>
// Marker x/y are CSS-viewport px; the track's `viewport` field (written by
// record_stop) maps them into video px.
const params = new URLSearchParams(location.search);
const SRC = params.get('src') || 'record.webm';
const TRACK = params.get('track') || SRC.replace(/\.webm$/, '.track.json');
const OUT_W = Number(params.get('w')) || 1920;
const FPS = 30;
const ZOOM = 1.9, EASE_IN = 420, HOLD = 1100, EASE_OUT = 460; // ms
const PAD = 0.06;                  // inset as fraction of output width
const RADIUS = 18;                 // corner radius in output px
const CURSOR_MS = 550;             // cursor travel time between markers
const hud = document.getElementById('hud');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const v = document.getElementById('v');

const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = t=>t*t*(3-2*t);
const clamp = (x,a,b)=>Math.min(Math.max(x,a),b);

// ---- zoom camera ----------------------------------------------------------
// snap focus to the latest click/scroll marker, zoom in, hold, ease out.
function makeCam(markers){
  const pts = (markers||[]).filter(m=>m.kind==='click'||m.kind==='scroll');
  return t=>{
    let focus=null;
    for(const m of pts){ if(m.t<=t) focus=m; else break; }
    if(!focus) return {s:1};
    const dt=t-focus.t;
    let s;
    if(dt<EASE_IN) s=lerp(1,ZOOM,smooth(dt/EASE_IN));
    else if(dt<EASE_IN+HOLD) s=ZOOM;
    else if(dt<EASE_IN+HOLD+EASE_OUT) s=lerp(ZOOM,1,smooth((dt-EASE_IN-HOLD)/EASE_OUT));
    else s=1;
    return {s, fx:focus.x, fy:focus.y};
  };
}

// ---- virtual cursor --------------------------------------------------------
// position: dwell at each marker, smoothstep to the next over CURSOR_MS.
function makeCursor(markers){
  const pts = (markers||[]).slice().sort((a,b)=>a.t-b.t);
  if(!pts.length) return null;
  return t=>{
    let prev=pts[0], next=null;
    for(const m of pts){ if(m.t<=t) prev=m; else { next=m; break; } }
    if(!next) return {x:prev.x, y:prev.y};
    const k = smooth(clamp((t-prev.t)/CURSOR_MS,0,1));
    return { x:lerp(prev.x,next.x,k), y:lerp(prev.y,next.y,k) };
  };
}
// click pulse: ring expands for ~350ms after a click marker
function clickPulse(markers){
  const clicks=(markers||[]).filter(m=>m.kind==='click');
  return t=>{
    for(const m of clicks){ const dt=t-m.t; if(dt>=0&&dt<350) return 1-dt/350; }
    return 0;
  };
}

function drawCursor(x,y,pulse){
  const s = cv.height/720;                    // scale cursor to canvas
  ctx.save();
  ctx.translate(x,y);
  if(pulse>0){
    ctx.beginPath(); ctx.arc(0,0,(14+26*(1-pulse))*s,0,7);
    ctx.strokeStyle=`rgba(255,255,255,${.85*pulse})`; ctx.lineWidth=2.5*s; ctx.stroke();
  }
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=6*s; ctx.shadowOffsetY=2*s;
  ctx.beginPath();
  const p=[[0,0],[0,17],[4.2,13.2],[7,19],[9.6,17.6],[6.9,12],[12,12]]; // classic arrow pts
  ctx.moveTo(0,0);
  for(const [px,py] of p) ctx.lineTo(px*s,py*s);
  ctx.closePath();
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.shadowColor='transparent';
  ctx.strokeStyle='#111'; ctx.lineWidth=1.4*s; ctx.stroke();
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

async function main(){
  const [blob, track] = await Promise.all([
    fetch(SRC).then(r=>r.blob()),
    fetch(TRACK).then(r=>r.json()).catch(()=>({markers:[]})),
  ]);
  v.src = URL.createObjectURL(blob);
  await new Promise(r=>v.onloadedmetadata=r);
  const vw=v.videoWidth, vh=v.videoHeight;
  const OUT_H = Math.round(OUT_W*vh/vw);
  cv.width=OUT_W; cv.height=OUT_H;
  const pad = OUT_W*PAD;
  const VX=pad, VY=pad, VW=OUT_W-2*pad, VH=OUT_H-2*pad;
  // CSS px -> video px. Without a viewport field assume they already match.
  const mx = track.viewport && track.viewport.w ? vw/track.viewport.w : 1;
  const my = track.viewport && track.viewport.h ? vh/track.viewport.h : 1;
  const toVideo = p => ({x:p.x*mx, y:p.y*my});
  hud.textContent = `src ${vw}x${vh} ${v.duration.toFixed(1)}s | out ${OUT_W}x${OUT_H} | markers ${(track.markers||[]).length} vp ${track.viewport?track.viewport.w+'x'+track.viewport.h:'-'} | rendering…`;

  // markers stored in CSS px -> work in video px from here on
  const markers = (track.markers||[]).map(m=>({...m, ...toVideo(m)}));
  const cam = makeCam(markers);
  const cursor = makeCursor(markers);
  const pulse = clickPulse(markers);
  const stream = cv.captureStream(FPS);
  const rec = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp9', videoBitsPerSecond:8e6});
  const chunks=[]; rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done = new Promise(r=>rec.onstop=r);
  rec.start(500);

  v.currentTime = 0; await v.play();
  const t0 = performance.now();
  const blurPx = OUT_W*0.05;
  function drawBackdrop(){
    ctx.save();
    ctx.filter = `blur(${blurPx}px) saturate(1.4) brightness(.55)`;
    ctx.drawImage(v, -pad*3, -pad*3, OUT_W+pad*6, OUT_H+pad*6);
    ctx.restore();
    ctx.fillStyle = 'rgba(12,13,18,.45)';
    ctx.fillRect(0,0,OUT_W,OUT_H);
  }
  function draw(){
    const t = v.currentTime*1000;
    const c = cam(t);
    const s = c.s;
    drawBackdrop();
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=OUT_W*0.02; ctx.shadowOffsetY=OUT_W*0.008;
    ctx.fillStyle='#000'; roundRect(VX,VY,VW,VH,RADIUS); ctx.fill();
    ctx.shadowColor='transparent';
    roundRect(VX,VY,VW,VH,RADIUS); ctx.clip();
    if(s>1 && c.fx!=null){
      const cw=vw/s, ch=vh/s;
      const sx=clamp(c.fx-cw/2,0,vw-cw), sy=clamp(c.fy-ch/2,0,vh-ch);
      ctx.drawImage(v, sx,sy,cw,ch, VX,VY,VW,VH);
    } else {
      ctx.drawImage(v, VX,VY,VW,VH);
    }
    ctx.restore();
    if(cursor){
      const cp=cursor(t); // video px
      let px,py;
      if(s>1 && c.fx!=null){
        const cw=vw/s, ch=vh/s;
        const sx=clamp(c.fx-cw/2,0,vw-cw), sy=clamp(c.fy-ch/2,0,vh-ch);
        px=VX+(cp.x-sx)/cw*VW; py=VY+(cp.y-sy)/ch*VH;
      } else {
        px=VX+cp.x/vw*VW; py=VY+cp.y/vh*VH;
      }
      px=clamp(px,VX,VX+VW); py=clamp(py,VY,VY+VH);
      drawCursor(px,py,pulse(t));
    }
    if(!v.ended) requestAnimationFrame(draw);
  }
  draw();
  await new Promise(r=>v.onended=r);
  await new Promise(r=>setTimeout(r,300));
  rec.stop(); await done;
  const out = new Blob(chunks,{type:'video/webm'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = SRC.replace(/\.webm$/,'.zoomed.webm');
  a.click();
  hud.textContent = `done: ${a.download} (${(out.size/1e6).toFixed(1)}MB, ${(performance.now()-t0)/1000|0}s render)`;
}
main().catch(e=>{hud.textContent='ERR '+e.message; hud.style.background='#c00'});
</script>
